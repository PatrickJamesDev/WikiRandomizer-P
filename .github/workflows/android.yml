name: Build Android

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "shared/**"
      - "baselineprofile/**"
      - "build_android.sh"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradle/**"
      - "gradlew"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "app/**"
      - "shared/**"
      - "baselineprofile/**"
      - "build_android.sh"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradle/**"
      - "gradlew"
      - ".github/workflows/android.yml"
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Install Android platform
        run: sdkmanager --install "platforms;android-36"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build shared tests and Android APK
        run: ./gradlew :shared:jvmTest :app:assembleDebug --no-configuration-cache --console=plain
